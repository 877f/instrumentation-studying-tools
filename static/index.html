<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Ch. 2 Study Tool</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0e1116; --card: #171b22; --raise: #1f252e; --border: #2b323d;
  --text: #e6e9ef; --muted: #97a1b0; --accent: #5aa2ff; --accent-ink: #06121f;
  --good: #3fcf8e; --good-bg: #10291f; --bad: #ff7676; --bad-bg: #2e1517;
  --warn: #f5c451; --warn-bg: #2b2410;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f4f6f9; --card: #ffffff; --raise: #eef1f5; --border: #d8dde5;
    --text: #141a22; --muted: #5b6575; --accent: #1f6fe5; --accent-ink: #ffffff;
    --good: #13804f; --good-bg: #e3f6ec; --bad: #c62f36; --bad-bg: #fdeaea;
    --warn: #8a6100; --warn-bg: #fff4d6;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: .85rem; margin: 22px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
h2:first-child { margin-top: 0; }
h3 { font-size: 1rem; margin: 18px 0 6px; }
p { margin: 8px 0; }
sup { font-size: .7em; line-height: 0; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin: 12px 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.hero { padding: 8px 0 0; }
.hero p { margin: 0; }

button { font: inherit; cursor: pointer; border-radius: 10px; min-height: 44px; padding: 0 16px;
  border: 1px solid var(--border); background: var(--raise); color: var(--text); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.ghost { background: transparent; }
button.danger { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
button.wide { width: 100%; margin-top: 12px; }
button.sm { min-height: 36px; padding: 0 12px; font-size: .9rem; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.modes, .parts { display: grid; gap: 8px; }
.mode, .part-chip { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--border);
  border-radius: 12px; background: var(--raise); cursor: pointer; }
.mode:has(input:checked), .part-chip:has(input:checked) { border-color: var(--accent); }
.mode input, .part-chip input, .toggle input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.mode span { display: flex; flex-direction: column; }
.mode small { color: var(--muted); font-size: .875rem; }
.part-chip .pt { flex: 1; }
.part-chip em { font-style: normal; color: var(--muted); font-size: .85rem; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--raise); cursor: pointer; }
.seg input:checked + span { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle { display: flex; gap: 10px; align-items: center; margin-top: 14px; cursor: pointer; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis div { background: var(--raise); border-radius: 10px; padding: 10px; text-align: center; }
.kpis b { display: block; font-size: 1.3rem; }
.kpis span { font-size: .8rem; color: var(--muted); }
.mini { padding-left: 18px; margin: 4px 0; }
.resume { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-color: var(--accent); }
.resume > div:first-child { display: flex; flex-direction: column; }
.row { display: flex; gap: 8px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.count { font-weight: 600; }
.badge { font-size: .8rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.bar { height: 6px; background: var(--raise); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar div { height: 100%; background: var(--accent); transition: width .3s; }
.partline { font-size: .8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.qmeta { font-size: .85rem; color: var(--muted); margin-top: 2px; }
.qtext { font-size: 1.2rem; line-height: 1.45; margin: 12px 0 16px; }
.lbl { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
.ansrow { display: flex; gap: 8px; }
.ansrow input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.ansrow input:disabled { opacity: .7; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { min-height: 36px; padding: 0 12px; font-size: .95rem; }
.tools { display: flex; gap: 8px; margin-top: 12px; }
.tools button { flex: 1; }
.hint { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); border: 1px solid var(--warn); }
.err { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bad-bg); color: var(--bad); }
.result { margin-top: 16px; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 1.1rem; }
.result.good { background: var(--good-bg); color: var(--good); }
.result.bad { background: var(--bad-bg); color: var(--bad); }
.msg { padding: 10px 12px; border-left: 3px solid var(--warn); background: var(--warn-bg); border-radius: 6px; }
.answer { font-size: 1.1rem; }
.steps { padding-left: 22px; margin: 0; }
.steps li { margin: 6px 0; }
.note { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--border); font-size: .92rem; color: var(--muted); }

.score { display: flex; align-items: baseline; gap: 12px; margin: 8px 0; }
.score b { font-size: 2.4rem; }
.score span { font-size: 1.2rem; color: var(--muted); }
.missed, .statlist { list-style: none; padding: 0; margin: 0; }
.missed li { padding: 12px 0; border-top: 1px solid var(--border); }
.missed li > div + div { margin-top: 4px; }
.good-text { color: var(--good); font-weight: 600; }
.statlist li { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: start; padding: 10px 0;
  border-top: 1px solid var(--border); font-size: .92rem; }
.statlist li:first-child { border-top: 0; }
.statlist .id { font-weight: 700; }
.statlist .nums { text-align: right; white-space: nowrap; }
.statlist .nums small { display: block; color: var(--muted); }
.statlist li.miss .id { color: var(--bad); }
.statlist li.ok .id { color: var(--good); }
.statlist li.new .nums { color: var(--muted); }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
'use strict';
const app = document.getElementById('app');
const MODES = {
  worksheet: { label: 'Worksheet', desc: 'Exact numbers from your sheet' },
  variations: { label: 'Variations', desc: 'Same questions, new random numbers' },
  weak: { label: 'Weak spots', desc: 'Picks the templates you miss most' },
};
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const prefs = Object.assign({ mode: 'worksheet', parts: [1, 2, 3, 4, 5], count: 'all', shuffle: false },
                            store.get('ch2.prefs') || {});
let sess = store.get('ch2.session');   // survives a phone browser reloading the tab
let stats = null;
let busy = false;

const $ = (id) => document.getElementById(id);
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function rich(s) { return esc(s).replace(/10\^(-?\d+)/g, '10<sup>$1</sup>'); }
function pct(c, a) { return a ? Math.round((100 * c) / a) + '%' : '–'; }
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function ago(iso) {
  if (!iso) return 'never';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return Math.floor(s / 86400) + ' d ago';
}
function saveSess() { sess ? store.set('ch2.session', sess) : store.del('ch2.session'); }
function savePrefs() { store.set('ch2.prefs', prefs); }

async function api(path, body) {
  const opts = body === undefined ? {} :
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  let r;
  try { r = await fetch(path, opts); } catch (e) {
    throw new Error("Can't reach the study tool server. Is py app.py still running on the computer?");
  }
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((data && data.error) || `Server error (${r.status})`);
  return data;
}

/* ------------------------------------------------------------------ home */

async function home() {
  window.scrollTo(0, 0);
  app.innerHTML = `
    <header class="hero"><h1>Chapter 2 Study Tool</h1>
      <p class="muted">Electronics Fundamentals · 54 worksheet questions</p></header>
    <div id="resume"></div>
    <section class="card" id="setup"><p class="muted">Loading…</p></section>
    <section class="card" id="overview" hidden></section>`;
  try { stats = await api('/api/stats'); } catch (e) {
    $('setup').innerHTML = `<div class="err">${esc(e.message)}</div><button class="primary wide" id="retry">Try again</button>`;
    $('retry').onclick = home;
    return;
  }
  renderResume();
  renderSetup();
  renderOverview();
}

function renderResume() {
  if (!sess) return;
  $('resume').innerHTML = `
    <section class="card resume">
      <div><b>Unfinished session</b>
        <span class="muted small">${MODES[sess.mode].label} · question ${sess.idx + 1} of ${sess.questions.length}</span></div>
      <div class="row"><button class="primary" id="resumeBtn">Resume</button>
        <button class="ghost" id="dropBtn">Discard</button></div>
    </section>`;
  $('resumeBtn').onclick = question;
  $('dropBtn').onclick = () => { sess = null; saveSess(); $('resume').innerHTML = ''; };
}

function modeNote() {
  const tried = stats.templates.some((t) => t.attempts);
  if (prefs.mode === 'worksheet') return 'Uses the exact numbers on your sheet, so you can compare against your own work.';
  if (prefs.mode === 'variations') return 'Same wording as the sheet, new numbers every time.';
  return tried ? 'Weighted toward templates you have missed, with new numbers.'
               : 'No history yet, so Weak spots picks evenly until you have answered some questions.';
}

function renderSetup() {
  $('setup').innerHTML = `
    <h2>Mode</h2>
    <div class="modes">${Object.entries(MODES).map(([k, m]) => `
      <label class="mode"><input type="radio" name="mode" value="${k}" ${prefs.mode === k ? 'checked' : ''}>
        <span><b>${m.label}</b><small>${m.desc}</small></span></label>`).join('')}</div>
    <h2>Parts</h2>
    <div class="parts">${Object.entries(stats.parts).map(([k, p]) => `
      <label class="part-chip"><input type="checkbox" name="part" value="${k}" ${prefs.parts.includes(+k) ? 'checked' : ''}>
        <span class="pt"><b>Part ${k}</b> ${esc(p.title)}</span><em>${p.count} Qs</em></label>`).join('')}</div>
    <h2>How many questions</h2>
    <div class="seg">${['5', '10', '20', 'all'].map((c) => `
      <label><input type="radio" name="count" value="${c}" ${String(prefs.count) === c ? 'checked' : ''}>
        <span>${c === 'all' ? 'All' : c}</span></label>`).join('')}</div>
    <label class="toggle" id="shuffleRow"><input type="checkbox" id="shuffle" ${prefs.shuffle ? 'checked' : ''}> Shuffle order</label>
    <p class="muted small" id="modeNote"></p>
    <div id="setupErr" class="err" hidden></div>
    <button class="primary wide" id="startBtn">Start</button>`;

  const sync = () => {
    prefs.mode = document.querySelector('input[name=mode]:checked').value;
    prefs.parts = [...document.querySelectorAll('input[name=part]:checked')].map((i) => +i.value);
    prefs.count = document.querySelector('input[name=count]:checked').value;
    prefs.shuffle = $('shuffle').checked;
    $('shuffleRow').hidden = prefs.mode === 'weak';
    $('modeNote').textContent = modeNote();
    savePrefs();
  };
  $('setup').addEventListener('change', sync);
  sync();
  $('startBtn').onclick = () => {
    if (!prefs.parts.length) return showSetupErr('Pick at least one part.');
    startSession({ mode: prefs.mode, parts: prefs.parts, count: prefs.count === 'all' ? 'all' : +prefs.count,
                   shuffle: prefs.shuffle });
  };
}

function showSetupErr(msg) { const e = $('setupErr'); e.textContent = msg; e.hidden = false; }

function renderOverview() {
  const el = $('overview');
  const ts = stats.templates;
  const att = ts.reduce((a, t) => a + t.attempts, 0);
  const cor = ts.reduce((a, t) => a + t.correct, 0);
  const seen = ts.filter((t) => t.attempts).length;
  const missed = ts.filter((t) => t.attempts > t.correct)
    .sort((a, b) => (b.attempts - b.correct) / b.attempts - (a.attempts - a.correct) / a.attempts
                    || (b.attempts - b.correct) - (a.attempts - a.correct));
  el.hidden = false;
  el.innerHTML = `
    <h2>Your progress</h2>
    ${att ? `<div class="kpis"><div><b>${att}</b><span>answers</span></div><div><b>${pct(cor, att)}</b><span>correct</span></div>
      <div><b>${seen}/54</b><span>tried</span></div></div>
      ${missed.length ? `<h3>Most missed</h3><ul class="mini">${missed.slice(0, 5).map((t) =>
        `<li><b>#${t.id}</b> <span class="muted">missed ${t.attempts - t.correct} of ${t.attempts}</span></li>`).join('')}</ul>` : ''}`
      : '<p class="muted">No answers yet. Worksheet mode is a good first pass: it checks your work against the sheet.</p>'}
    <button class="ghost wide" id="statsBtn">See all 54 templates</button>`;
  $('statsBtn').onclick = statsView;
}

async function startSession(body) {
  try {
    const r = await api('/api/session', body);
    sess = { mode: r.mode, questions: r.questions, idx: 0, results: [], answered: false, feedback: null };
    saveSess();
    question();
  } catch (e) {
    if ($('setupErr')) showSetupErr(e.message); else alert(e.message);
  }
}

/* -------------------------------------------------------------- question */

function chips(q) {
  const c = [['×10^', 'x10^'], ['µ', 'µ'], ['n', 'n'], ['m', 'm'], ['k', 'k'], ['M', 'M']];
  if (q.unit !== 'electrons') c.push([q.unit, q.unit]);
  return c;
}

function question() {
  window.scrollTo(0, 0);
  const q = sess.questions[sess.idx];
  const n = sess.questions.length;
  const h = q.history || { attempts: 0, correct: 0 };
  app.innerHTML = `
    <div class="topbar">
      <button class="ghost sm" id="endBtn">End session</button>
      <span class="count">${sess.idx + 1} / ${n}</span>
      <span class="badge">${MODES[sess.mode].label}</span>
    </div>
    <div class="bar"><div style="width:${(100 * sess.idx) / n}%"></div></div>
    <section class="card">
      <div class="partline">Part ${q.part}: ${esc(q.part_title)}</div>
      <div class="qmeta">#${q.template_id} · ${q.varied ? 'new numbers' : 'worksheet numbers'} ·
        ${h.attempts ? `${h.correct}/${h.attempts} right before` : 'first try'}</div>
      <p class="qtext">${rich(q.text)}</p>
      <form id="ansForm" autocomplete="off">
        <label for="ans" class="lbl">Your answer: ${esc(q.quantity_label)}, in ${esc(q.unit)}</label>
        <div class="ansrow">
          <input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                 enterkeyhint="done" placeholder="e.g. 2.5e3 or 2.5k">
          <button class="primary" id="checkBtn" type="submit">Check</button>
        </div>
        <div class="chips">${chips(q).map(([label, ins]) =>
          `<button type="button" class="chip" data-ins="${esc(ins)}">${esc(label)}</button>`).join('')}</div>
        <p class="muted small">Units are optional. 2500, 2.5e3, 2.5k, 6.25 x 10^18 and 5 mA all work.</p>
      </form>
      <div id="err" class="err" hidden></div>
      <div class="tools">
        <button class="ghost" id="hintBtn" type="button">Hint</button>
        <button class="ghost" id="giveBtn" type="button">Show answer</button>
      </div>
      <div id="hint" class="hint" hidden><b>Formula:</b> ${rich(q.hint)}</div>
      <div id="fb"></div>
    </section>`;

  const input = $('ans');
  $('ansForm').onsubmit = (e) => { e.preventDefault(); submitAnswer(); };
  $('hintBtn').onclick = () => { $('hint').hidden = !$('hint').hidden; };
  $('giveBtn').onclick = giveUp;
  $('endBtn').onclick = () => {
    if (confirm('End this session? You will see a summary of what you answered.')) finish();
  };
  document.querySelectorAll('.chip').forEach((b) => {
    b.addEventListener('pointerdown', (e) => e.preventDefault());   // keep the phone keyboard open
    b.addEventListener('click', () => insertAtCursor(input, b.dataset.ins));
  });
  if (sess.answered && sess.feedback) {
    input.value = sess.feedback.your || '';
    lockInputs();
    showFeedback(sess.feedback.res, false);
  } else {
    input.focus();
  }
}

function insertAtCursor(input, text) {
  if (input.disabled) return;
  const s = input.selectionStart ?? input.value.length;
  const e = input.selectionEnd ?? s;
  input.value = input.value.slice(0, s) + text + input.value.slice(e);
  input.setSelectionRange(s + text.length, s + text.length);
  input.focus();
}

function showErr(msg) { const e = $('err'); e.textContent = msg; e.hidden = false; }

function lockInputs() {
  ['ans', 'checkBtn', 'giveBtn'].forEach((id) => { $(id).disabled = true; });
  document.querySelectorAll('.chip').forEach((b) => { b.disabled = true; });
}

async function submitAnswer() {
  if (sess.answered || busy) return;
  const q = sess.questions[sess.idx];
  const raw = $('ans').value.trim();
  if (!raw) return showErr('Type an answer first, or tap Show answer.');
  $('err').hidden = true;
  busy = true;
  $('checkBtn').disabled = true;
  try {
    const res = await api('/api/check', { template_id: q.template_id, params: q.params, answer: raw, uid: q.uid });
    if (res.status === 'unparsed') return showErr(res.message);
    finishQuestion(res, raw);
  } catch (e) {
    showErr(e.message);
  } finally {
    busy = false;
    if (!sess || !sess.answered) { const b = $('checkBtn'); if (b) b.disabled = false; }
  }
}

async function giveUp() {
  if (sess.answered || busy) return;
  const q = sess.questions[sess.idx];
  busy = true;
  try {
    const res = await api('/api/reveal', { template_id: q.template_id, params: q.params, uid: q.uid });
    finishQuestion(res, '');
  } catch (e) {
    showErr(e.message);
  } finally {
    busy = false;
  }
}

function finishQuestion(res, raw) {
  const q = sess.questions[sess.idx];
  sess.answered = true;
  sess.feedback = { res, your: raw };
  sess.results.push({
    template_id: q.template_id, part: q.part, text: q.text, correct: res.status === 'correct',
    revealed: res.status === 'revealed', alternate: !!res.alternate, your: raw, correct_answer: res.correct_answer,
  });
  saveSess();
  lockInputs();
  showFeedback(res, true);
}

function showFeedback(res, scroll) {
  const ok = res.status === 'correct';
  const revealed = res.status === 'revealed';
  const last = sess.idx === sess.questions.length - 1;
  const head = ok ? (res.alternate ? '✓ Accepted' : '✓ Correct') : revealed ? 'Answer shown (counts as a miss)' : '✗ Not quite';
  const fb = $('fb');
  fb.innerHTML = `
    <div class="result ${ok ? 'good' : 'bad'}">${head}</div>
    ${res.read_as ? `<p class="small muted">Read your answer as ${rich(res.read_as)}</p>` : ''}
    ${res.message ? `<p class="msg">${rich(res.message)}</p>` : ''}
    <p class="answer">Correct answer: <strong>${rich(res.correct_answer)}</strong></p>
    <h3>Worked solution</h3>
    <ol class="steps">${res.steps.map((s) => `<li>${rich(s)}</li>`).join('')}</ol>
    ${(res.notes || []).map((n) => `<div class="note">${rich(n)}</div>`).join('')}
    <button class="primary wide" id="nextBtn">${last ? 'See summary' : 'Next question →'}</button>`;
  $('nextBtn').onclick = next;
  if (scroll) fb.scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('nextBtn').focus({ preventScroll: true });
}

function next() {
  if (sess.idx >= sess.questions.length - 1) return finish();
  sess.idx += 1;
  sess.answered = false;
  sess.feedback = null;
  saveSess();
  question();
}

/* --------------------------------------------------------------- summary */

function finish() {
  const done = sess;
  sess = null;
  saveSess();
  const answered = done.results.length;
  const correct = done.results.filter((r) => r.correct).length;
  const missedIds = [...new Set(done.results.filter((r) => !r.correct).map((r) => r.template_id))];
  if (answered) {
    api('/api/session/complete', { mode: done.mode, answered, correct, missed: missedIds }).catch(() => {});
  }
  summary(done);
}

function summary(done) {
  window.scrollTo(0, 0);
  const res = done.results;
  const answered = res.length;
  const correct = res.filter((r) => r.correct).length;
  const missed = res.filter((r) => !r.correct);
  const alts = res.filter((r) => r.alternate);
  const skipped = done.questions.length - answered;
  app.innerHTML = `
    <section class="card">
      <h1>Session summary</h1>
      <div class="score"><b>${correct} / ${answered}</b><span>${pct(correct, answered)}</span></div>
      <p class="muted">${MODES[done.mode].label} mode${skipped ? ` · ended early, ${skipped} not answered` : ''}</p>
      ${missed.length ? `<h2>Missed templates (${missed.length})</h2>
        <ul class="missed">${missed.map((r) => `
          <li><div><b>#${r.template_id}</b> <span class="muted small">Part ${r.part}</span></div>
            <div>${rich(r.text)}</div>
            <div class="small">Correct: <b>${rich(r.correct_answer)}</b> · You: ${r.revealed ? '(showed answer)' : esc(r.your)}</div></li>`).join('')}
        </ul>` : answered ? '<p class="good-text">No misses. Clean sweep.</p>' : ''}
      ${alts.length ? `<div class="note">Accepted under the other reading of the wording: ${alts.map((r) => '#' + r.template_id).join(', ')}.
        Check which reading your teacher wants.</div>` : ''}
      ${missed.length ? `<button class="primary wide" id="retrySame">Retry missed: same numbers</button>
        <button class="ghost wide" id="retryNew">Retry missed: new numbers</button>` : ''}
      <button class="${missed.length ? 'ghost' : 'primary'} wide" id="homeBtn">Home</button>
    </section>`;
  $('homeBtn').onclick = home;
  if (!missed.length) return;
  $('retrySame').onclick = () => {
    const qs = done.questions.filter((q, i) => res[i] && !res[i].correct).map((q) => Object.assign({}, q, { uid: uid() }));
    sess = { mode: done.mode, questions: qs, idx: 0, results: [], answered: false, feedback: null };
    saveSess();
    question();
  };
  $('retryNew').onclick = () => startSession({
    mode: 'variations', template_ids: [...new Set(missed.map((r) => r.template_id))], count: 'all', shuffle: true,
  });
}

/* ----------------------------------------------------------------- stats */

async function statsView() {
  window.scrollTo(0, 0);
  try { stats = await api('/api/stats'); } catch (e) { alert(e.message); return; }
  const row = (t) => {
    const cls = !t.attempts ? 'new' : t.correct === t.attempts ? 'ok' : t.last_correct === false ? 'miss' : '';
    return `<li class="${cls}"><span class="id">#${t.id}</span><span>${rich(t.text)}</span>
      <span class="nums">${t.attempts ? `${t.correct}/${t.attempts} · ${pct(t.correct, t.attempts)}` : 'not tried'}
        ${t.attempts ? `<small>${ago(t.last_seen)}</small>` : ''}</span></li>`;
  };
  app.innerHTML = `
    <div class="topbar"><button class="ghost sm" id="backBtn">← Home</button><span class="count">All templates</span><span></span></div>
    ${Object.entries(stats.parts).map(([k, p]) => `
      <section class="card"><h2>Part ${k}: ${esc(p.title)}</h2>
        <ul class="statlist">${stats.templates.filter((t) => t.part === +k).map(row).join('')}</ul></section>`).join('')}
    <section class="card"><h2>Reset</h2>
      <p class="muted small">Clears every template's saved stats in progress.json.</p>
      <button class="danger" id="resetBtn">Reset progress</button></section>`;
  $('backBtn').onclick = home;
  $('resetBtn').onclick = async () => {
    if (!confirm('Reset all progress? This clears the stats for all 54 templates.')) return;
    try { await api('/api/progress/reset', {}); statsView(); } catch (e) { alert(e.message); }
  };
}

home();
</script>
</body>
</html>
